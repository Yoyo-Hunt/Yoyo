<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap"><title>Snake</title><style>:root{--bg:#F5F6FC;--panel:#FFF;--ink:#12142B;--muted:#5A5F7D;--line:#E1E4F2;--accent:#4F3FE8;--ac:#FFF;--good:#14804A;--bad:#D23B3B;--hl:#FFB020;--warn:#A86400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0D1E;--panel:#15183A;--ink:#EEF0FF;--muted:#A3A9CC;--line:#2A2E5C;--accent:#9C8FFF;--ac:#0B0D1E;--good:#5FD394;--bad:#FF8A80;--hl:#FFC24D;--warn:#F2B35E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0D1E;--panel:#15183A;--ink:#EEF0FF;--muted:#A3A9CC;--line:#2A2E5C;--accent:#9C8FFF;--ac:#0B0D1E;--good:#5FD394;--bad:#FF8A80;--hl:#FFC24D;--warn:#F2B35E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
h1{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;letter-spacing:-.03em;margin:0 0 .3rem;line-height:1.1}
h2{font-size:1.05rem;margin:0 0 .6rem}
.sub{color:var(--muted);margin:0 0 1.5rem;max-width:40rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--accent);color:var(--ac);border:0;border-radius:6px;padding:.55rem 1rem;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;width:100%}
ul{list-style:none;margin:0;padding:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}

.wrap{max-width:460px;text-align:center}
canvas{width:100%;max-width:360px;aspect-ratio:1;border:2px solid var(--line);border-radius:10px;touch-action:none;background:var(--panel)}
.bar{display:flex;justify-content:space-between;max-width:360px;margin:0 auto .6rem;font-weight:600}
#msg{min-height:1.6rem;color:var(--muted);margin:.7rem 0}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:.4rem;justify-content:center;margin:.8rem 0}
.pad button{padding:.8rem 0;font-size:1.2rem}.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.back{margin:0 0 1.2rem}.back a{display:inline-block;color:var(--accent);font-weight:600;text-decoration:none;border:1.5px solid var(--line);border-radius:6px;padding:.3rem .8rem}.back a:hover{border-color:var(--accent)}
</style></head><body><div class="wrap">
<p class="back"><a href="../index.html#demos">← Back to portfolio</a></p>
<h1>Snake</h1>
<p class="sub">Eat the food, grow longer, and don’t hit the walls or yourself.</p>
<div class="bar"><span>Score: <span id="sc">0</span></span><span>Best: <span id="bs">0</span></span></div>
<canvas id="cv" aria-label="Snake game board"></canvas>
<p id="msg">Press Start or any arrow key.</p>
<button id="go">Start</button>
<div class="pad" aria-label="Direction buttons"><button class="u" data-d="0,-1" aria-label="Up">↑</button><button class="l" data-d="-1,0" aria-label="Left">←</button><button class="d" data-d="0,1" aria-label="Down">↓</button><button class="r" data-d="1,0" aria-label="Right">→</button></div>
</div><script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d'),G=18,C=20;cv.width=cv.height=G*C;
let snake,dir,next,food,score=0,best=0,timer,state='idle';
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
const $=id=>document.getElementById(id);
function place(){do{food={x:Math.floor(Math.random()*G),y:Math.floor(Math.random()*G)}}while(snake.some(s=>s.x==food.x&&s.y==food.y))}
function reset(){snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir=next={x:1,y:0};score=0;place();hud()}
function hud(){$('sc').textContent=score;$('bs').textContent=best}
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function draw(){cx.fillStyle=col('--panel');cx.fillRect(0,0,cv.width,cv.height);
 cx.fillStyle=col('--bad');cx.fillRect(food.x*C+3,food.y*C+3,C-6,C-6);
 cx.fillStyle=col('--accent');snake.forEach((s,i)=>{cx.globalAlpha=i?0.8:1;cx.fillRect(s.x*C+1,s.y*C+1,C-2,C-2)});cx.globalAlpha=1}
function run(){clearInterval(timer);timer=setInterval(step,Math.max(60,140-score*4))}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.y<0||h.x>=G||h.y>=G||snake.some(s=>s.x==h.x&&s.y==h.y)){clearInterval(timer);state='over';
  if(score>best){best=score;try{localStorage.setItem('snakeBest',best)}catch(e){}}hud();$('msg').textContent='Game over. You scored '+score+'.';$('go').textContent='Play again';return}
 snake.unshift(h);if(h.x==food.x&&h.y==food.y){score++;place();hud();run()}else snake.pop();draw()}
function start(){if(state=='run'){state='pause';clearInterval(timer);$('msg').textContent='Paused.';$('go').textContent='Resume';return}
 if(state!='pause')reset();state='run';$('msg').textContent='';$('go').textContent='Pause';run();draw()}
function turn(x,y){if(state!='run'){start()}if(x==-dir.x&&y==-dir.y)return;next={x,y}}
document.addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
 if(m){e.preventDefault();turn(...m)}else if(e.key==' '){e.preventDefault();start()}});
$('go').onclick=start;
document.querySelector('.pad').onclick=e=>{const b=e.target.closest('button');if(b)turn(...b.dataset.d.split(',').map(Number))};
let t0;cv.addEventListener('touchstart',e=>{t0=e.touches[0]});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-t0.clientX,dy=t.clientY-t0.clientY;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
 Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)});
reset();draw();
</script></body></html>
